[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gptme-grimdall"
version = "0.1.0"
description = "Deterministic security plugin for gptme — blocks destructive shell commands, secret reads, and undeclared egress. Shadow-mode default."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "grimdalltech" }]
keywords = ["gptme", "security", "plugin", "guardrails", "deterministic", "hook"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = ["gptme"]

[project.optional-dependencies]
test = ["pytest"]

[project.entry-points."gptme.plugins"]
grimdall = "gptme_grimdall.plugin:plugin"

[tool.setuptools.packages.find]
include = ["gptme_grimdall*"]
